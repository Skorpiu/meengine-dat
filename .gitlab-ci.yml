image: node:24

default:
  tags:
    - dat

stages:
  - check
  - integration

variables:
  # Prisma needs these env vars to exist for `prisma generate` during install.
  # They do NOT need to be real DBs for unit/integration tests with mocks.
  DATABASE_URL: "postgresql://user:pass@localhost:5432/postgres?schema=public"
  DIRECT_URL: "postgresql://user:pass@localhost:5432/postgres?schema=public"
  NEXTAUTH_SECRET: "ci_dummy_nextauth_secret"

cache:
  key:
    files:
      - driving_school_platform/nextjs_space/pnpm-lock.yaml
  paths:
    - driving_school_platform/nextjs_space/.pnpm-store
    - driving_school_platform/nextjs_space/.next/cache

before_script:
  - corepack enable
  - corepack prepare pnpm@10.24.0 --activate
  - pnpm -v
  - export PNPM_HOME="$CI_PROJECT_DIR/.pnpm"
  - export PATH="$PNPM_HOME:$PATH"
  # CI validation must never inherit a hosted DB target from higher-precedence
  # GitLab CI/CD variables or runner-provided environment. Reassert loopback
  # dummies in this job shell after environment injection (DEC-068).
  - export DATABASE_URL="postgresql://dat_ci:dat_ci@127.0.0.1:5432/dat_ci?schema=public"
  - export DIRECT_URL="$DATABASE_URL"
  - pnpm config set store-dir "$CI_PROJECT_DIR/driving_school_platform/nextjs_space/.pnpm-store"
  - pnpm -C driving_school_platform/nextjs_space install --frozen-lockfile

check:
  stage: check
  script:
    - pnpm -C driving_school_platform/nextjs_space check

database-integration:
  stage: integration
  services:
    - name: postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
      alias: dat-integration-postgres
      variables:
        POSTGRES_USER: dat_it
        POSTGRES_PASSWORD: dat_it
        POSTGRES_DB: dat_it
  variables:
    POSTGRES_USER: dat_it
    POSTGRES_PASSWORD: dat_it
    POSTGRES_DB: dat_it
    DAT_INTEGRATION_PROVISION_MODE: ci-external
    INTEGRATION_DATABASE_URL: "postgresql://dat_it:dat_it@dat-integration-postgres:5432/dat_it?schema=public"
  script:
    - pnpm -C driving_school_platform/nextjs_space test:integration:ci
